<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生鮮蔬果小鋪</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #fbfbf9;
      color: #333;
    }

    /* 頂部導覽列：紅、綠、黃 三色漸層 */
    header {
      background: linear-gradient(135deg, #e63946 0%, #2a9d8f 50%, #e9c46a 100%);
      color: white;
      padding: 20px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-bottom: 4px solid #2a9d8f;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area h1 {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .logo-area p {
      font-size: 13px;
      opacity: 0.95;
      margin-top: 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .cart-btn {
      background: white;
      color: #333;
      border: 2px solid #2a9d8f;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }

    .cart-btn:hover {
      background: #f0fdf4;
      transform: scale(1.03);
    }

    .badge {
      background-color: #e63946;
      color: white;
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: bold;
    }

    /* ================= 頁首 5 圖輪播橫框 ================= */
    .banner-carousel-wrapper {
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 20px;
      position: relative;
    }

    .banner-carousel-box {
      background: white;
      border: 3px solid #2a9d8f;
      border-radius: 14px;
      padding: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      position: relative;
    }

    .banner-track-container {
      overflow: hidden;
      width: 100%;
    }

    .banner-track {
      display: flex;
      gap: 12px;
      transition: transform 0.45s ease-in-out;
    }

    .banner-img-item {
      flex: 0 0 calc((100% - 48px) / 5); /* 寬度均分為 5 張圖，扣除 4 個間距 */
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      background-color: #f2f2f2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      position: relative;
    }

    .banner-img-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .banner-img-item:hover img {
      transform: scale(1.06);
    }

    /* 輪播左右手動切換按鈕 */
    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #2a9d8f;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      color: #2a9d8f;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }

    .carousel-nav-btn:hover {
      background: #2a9d8f;
      color: white;
    }

    .carousel-prev {
      left: 28px;
    }

    .carousel-next {
      right: 28px;
    }

    /* 分類標籤列（紅、綠、黃） */
    .filter-section {
      max-width: 1200px;
      margin: 22px auto 16px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .filter-btn {
      background: white;
      padding: 9px 24px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 25px;
      transition: all 0.25s;
    }

    /* 1: 紅色按鈕 */
    .filter-btn:nth-child(1) {
      border: 2.5px solid #e63946;
      color: #e63946;
    }
    .filter-btn:nth-child(1).active {
      background: #e63946;
      color: white;
    }

    /* 2: 綠色按鈕 */
    .filter-btn:nth-child(2) {
      border: 2.5px solid #2a9d8f;
      color: #2a9d8f;
    }
    .filter-btn:nth-child(2).active {
      background: #2a9d8f;
      color: white;
    }

    /* 3: 黃色按鈕 */
    .filter-btn:nth-child(3) {
      border: 2.5px solid #d4a017;
      color: #996e00;
    }
    .filter-btn:nth-child(3).active {
      background: #e9c46a;
      color: #4a3400;
    }

    /* 商品列表網格 */
    .products-grid {
      max-width: 1200px;
      margin: 0 auto 50px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    /* 商品卡片基礎樣式 */
    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    /* 規律三色邊框 */
    .product-card.theme-red {
      border: 2.5px solid #e63946;
    }
    .product-card.theme-red:hover {
      box-shadow: 0 8px 20px rgba(230, 57, 70, 0.2);
    }
    .product-card.theme-red .tag {
      background: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
    }
    .product-card.theme-red .price {
      color: #e63946;
    }
    .product-card.theme-red .btn-add {
      background: #e63946;
    }

    .product-card.theme-green {
      border: 2.5px solid #2a9d8f;
    }
    .product-card.theme-green:hover {
      box-shadow: 0 8px 20px rgba(42, 157, 143, 0.22);
    }
    .product-card.theme-green .tag {
      background: #e6f7f4;
      color: #1e7066;
      border: 1px solid #b2dfdb;
    }
    .product-card.theme-green .price {
      color: #2a9d8f;
    }
    .product-card.theme-green .btn-add {
      background: #2a9d8f;
    }

    .product-card.theme-yellow {
      border: 2.5px solid #e9c46a;
    }
    .product-card.theme-yellow:hover {
      box-shadow: 0 8px 20px rgba(233, 196, 106, 0.35);
    }
    .product-card.theme-yellow .tag {
      background: #fff9e6;
      color: #926b05;
      border: 1px solid #ffe599;
    }
    .product-card.theme-yellow .price {
      color: #b38304;
    }
    .product-card.theme-yellow .btn-add {
      background: #e9c46a;
      color: #3b2a00;
    }

    .product-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background-color: #f2f2f2;
    }

    .product-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
    }

    .tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
    }

    .product-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.45;
      margin-bottom: 14px;
      flex-grow: 1;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #e8e8e8;
      padding-top: 10px;
    }

    .price {
      font-size: 16px;
      font-weight: bold;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-detail {
      background: #f7f7f7;
      border: 1px solid #ddd;
      color: #666;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-add {
      border: none;
      color: white;
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-add:hover {
      opacity: 0.88;
      transform: scale(1.05);
    }

    /* 購物車彈窗樣式 */
    .cart-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .cart-modal {
      background: white;
      width: 90%;
      max-width: 550px;
      max-height: 80vh;
      border-radius: 12px;
      border: 3px solid #2a9d8f;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .cart-modal-header {
      padding: 16px 20px;
      border-bottom: 2px dashed #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }

    .cart-modal-header h2 {
      font-size: 18px;
      background: linear-gradient(90deg, #e63946, #2a9d8f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 26px;
      color: #888;
      cursor: pointer;
    }

    .cart-items-container {
      padding: 16px 20px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f2f2f2;
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      border: 1.5px solid #2a9d8f;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-name {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .cart-item-price {
      font-size: 13px;
      color: #e63946;
      margin-top: 4px;
      font-weight: bold;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quantity-btn {
      background: #f5f5f5;
      border: 1px solid #ddd;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
    }

    .cart-modal-footer {
      padding: 16px 20px;
      border-top: 2px dashed #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .total-price {
      font-size: 17px;
      font-weight: bold;
      color: #222;
    }

    .total-price span {
      color: #e63946;
    }

    .checkout-btn {
      background: linear-gradient(135deg, #e63946, #2a9d8f);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(42, 157, 143, 0.3);
      transition: opacity 0.2s;
    }

    .checkout-btn:hover {
      opacity: 0.9;
    }

    .empty-cart-text {
      text-align: center;
      padding: 30px 0;
      color: #999;
    }

    /* 手機平板響應式調整 */
    @media (max-width: 768px) {
      .banner-img-item {
        flex: 0 0 calc((100% - 24px) / 3); /* 手機端自動改為展示 3 張 */
        height: 100px;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header>
    <div class="header-container">
      <div class="logo-area">
        <h1>🍎 生鮮蔬果小鋪</h1>
        <p>在地小農新鮮直送，三色鮮享安心健康</p>
      </div>
      <button class="cart-btn" onclick="openCart()">
        🛒 購物車 <span class="badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <!-- 頁首 5 圖自動輪播橫框 -->
  <section class="banner-carousel-wrapper">
    <button class="carousel-nav-btn carousel-prev" onclick="prevSlide()">&#10094;</button>
    <div class="banner-carousel-box" id="carouselBox">
      <div class="banner-track-container">
        <div class="banner-track" id="bannerTrack">
          <!-- 圖片由 JavaScript 動態填入 -->
        </div>
      </div>
    </div>
    <button class="carousel-nav-btn carousel-next" onclick="nextSlide()">&#10095;</button>
  </section>

  <!-- 分類篩選按鈕（紅、綠、黃） -->
  <div class="filter-section">
    <button class="filter-btn active" onclick="filterItems('all', this)">田 全部食品 (30)</button>
    <button class="filter-btn" onclick="filterItems('veg', this)">🥬 新鮮蔬菜 (15)</button>
    <button class="filter-btn" onclick="filterItems('fruit', this)">🍎 當令水果 (15)</button>
  </div>

  <!-- 商品網格 -->
  <main class="products-grid" id="productContainer"></main>

  <!-- 購物車彈窗 -->
  <div class="cart-modal-overlay" id="cartOverlay">
    <div class="cart-modal">
      <div class="cart-modal-header">
        <h2>已選購商品</h2>
        <button class="close-btn" onclick="closeCart()">&times;</button>
      </div>
      
      <div class="cart-items-container" id="cartItemsList"></div>

      <div class="cart-modal-footer">
        <div class="total-price">
          總計：<span id="cartTotalPrice">NT$ 0</span>
        </div>
        <button class="checkout-btn" onclick="alert('感謝您的訂購！訂單已送出。')">前往結帳</button>
      </div>
    </div>
  </div>

    let cart = {};

    /* ================= 頁首輪播控制邏輯 ================= */
    let currentSlide = 0;
    let autoPlayTimer = null;
    const allImages = products.map(p => ({
      image: p.image,
      fallback: p.category === 'veg' ? FALLBACK_VEG : FALLBACK_FRUIT
    }));

    function initCarousel() {
      const track = document.getElementById("bannerTrack");
      // 串接兩份清單以保證平滑連續輪播
      const duplicatedList = [...allImages, ...allImages];
      track.innerHTML = duplicatedList.map(item => `
        <div class="banner-img-item">
          <img src="${item.image}" loading="lazy" onerror="this.onerror=null; this.src='${item.fallback}';">
        </div>
      `).join('');

      startAutoPlay();

      // 滑鼠懸停時暫停自動播放，移開時繼續
      const box = document.getElementById("carouselBox");
      box.addEventListener("mouseenter", stopAutoPlay);
      box.addEventListener("mouseleave", startAutoPlay);
    }

    function updateCarouselPosition() {
      const track = document.getElementById("bannerTrack");
      const firstItem = track.querySelector(".banner-img-item");
      if (!firstItem) return;
      
      const itemWidth = firstItem.offsetWidth + 12; // 寬度加上間隙 12px
      track.style.transform = `translateX(-${currentSlide * itemWidth}px)`;

      // 循環回到開頭
      if (currentSlide >= allImages.length) {
        setTimeout(() => {
          track.style.transition = 'none';
          currentSlide = 0;
          track.style.transform = `translateX(0px)`;
          setTimeout(() => {
            track.style.transition = 'transform 0.45s ease-in-out';
          }, 50);
        }, 460);
      }
    }

    function nextSlide() {
      currentSlide++;
      updateCarouselPosition();
    }

    function prevSlide() {
      if (currentSlide <= 0) {
        currentSlide = allImages.length - 1;
      } else {
        currentSlide--;
      }
      updateCarouselPosition();
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlayTimer = setInterval(nextSlide, 2500); // 每 2.5 秒輪替一次
    }

    function stopAutoPlay() {
      if (autoPlayTimer) clearInterval(autoPlayTimer);
    }

    /* ================= 商品列表渲染 ================= */
    function renderProducts(items) {
      const container = document.getElementById("productContainer");
      const colorThemes = ['theme-red', 'theme-green', 'theme-yellow'];

      container.innerHTML = items.map((item, index) => {
        const theme = colorThemes[index % 3];
        const fallback = item.category === 'veg' ? FALLBACK_VEG : FALLBACK_FRUIT;

        return `
          <div class="product-card ${theme}">
            <img src="${item.image}" alt="${item.name}" class="product-img" loading="lazy" onerror="this.onerror=null; this.src='${fallback}';">
            <div class="product-info">
              <h3 class="product-title">${item.name}</h3>
              <div class="tags">
                ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
              </div>
              <p class="product-desc">${item.desc}</p>
              <div class="product-footer">
                <span class="price">NT$ ${item.price}</span>
                <div class="card-actions">
                  <button class="btn-detail" onclick="alert('${item.name}：${item.desc}')">詳細</button>
                  <button class="btn-add" onclick="addToCart(${item.id})">加購</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 分類篩選
    function filterItems(category, btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (category === "all") {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.category === category);
        renderProducts(filtered);
      }
    }

    // 加入購物車
    function addToCart(productId) {
      if (cart[productId]) {
        cart[productId]++;
      } else {
        cart[productId] = 1;
      }
      updateCartBadge();
    }

    // 增減數量
    function changeQuantity(productId, delta) {
      if (cart[productId]) {
        cart[productId] += delta;
        if (cart[productId] <= 0) {
          delete cart[productId];
        }
      }
      updateCartBadge();
      renderCartItems();
    }

    // 更新數量徽章
    function updateCartBadge() {
      const totalCount = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      document.getElementById("cartBadge").innerText = totalCount;
    }

    // 開啟購物車彈窗
    function openCart() {
      renderCartItems();
      document.getElementById("cartOverlay").style.display = "flex";
    }

    // 關閉購物車彈窗
    function closeCart() {
      document.getElementById("cartOverlay").style.display = "none";
    }

    // 點擊空白處關閉
    window.onclick = function(event) {
      const modal = document.getElementById("cartOverlay");
      if (event.target === modal) {
        closeCart();
      }
    };

    // 渲染購物車內品項
    function renderCartItems() {
      const container = document.getElementById("cartItemsList");
      const cartKeys = Object.keys(cart);

      if (cartKeys.length === 0) {
        container.innerHTML = '<div class="empty-cart-text">購物車目前是空的，快去選購新鮮蔬果吧！</div>';
        document.getElementById("cartTotalPrice").innerText = "NT$ 0";
        return;
      }

      let totalAmount = 0;
      let html = "";

      cartKeys.forEach(id => {
        const product = products.find(p => p.id === parseInt(id));
        const quantity = cart[id];
        const subtotal = product.price * quantity;
        const fallback = product.category === 'veg' ? FALLBACK_VEG : FALLBACK_FRUIT;
        totalAmount += subtotal;

        html += `
          <div class="cart-item">
            <img src="${product.image}" alt="${product.name}" class="cart-item-img" onerror="this.onerror=null; this.src='${fallback}';">
            <div class="cart-item-info">
              <div class="cart-item-name">${product.name}</div>
              <div class="cart-item-price">NT$ ${product.price} × ${quantity} = NT$ ${subtotal}</div>
            </div>
            <div class="quantity-control">
              <button class="quantity-btn" onclick="changeQuantity(${product.id}, -1)">-</button>
              <span>${quantity}</span>
              <button class="quantity-btn" onclick="changeQuantity(${product.id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById("cartTotalPrice").innerText = `NT$ ${totalAmount}`;
    }

    // 頁面初始化
    window.onload = function() {
      initCarousel();
      renderProducts(products);
    };

    // 視窗大小改變時校正輪播距離
    window.onresize = function() {
      updateCarouselPosition();
    };
  </script>
